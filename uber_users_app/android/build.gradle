buildscript {
    ext.kotlin_version = "2.1.21"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.11.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.3"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    plugins.withId("com.android.library") {
        def androidExt = extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("namespace")) {
            if (androidExt.namespace == null || androidExt.namespace.toString().trim().isEmpty()) {
                androidExt.namespace = "com.ghamdan.${project.name.replace('-', '_')}"
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

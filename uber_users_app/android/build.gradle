allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    plugins.withId("com.android.library") {
        def androidExt = extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("namespace")) {
            if (androidExt.namespace == null || androidExt.namespace.toString().trim().isEmpty()) {
                androidExt.namespace = "com.ghamdan.${project.name.replace('-', '_')}"
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

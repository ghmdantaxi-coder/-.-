name: ghamdan_taxi_app
description: Ghamdan Taxi User App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_database: ^11.3.10
  firebase_storage: ^12.4.10

  # Google Maps & Location
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_polyline_points: ^3.0.1
  flutter_geofire: ^2.0.1

  # Google Services
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0

  # Network
  connectivity_plus: ^6.1.5
  http: ^1.5.0

  # State Management
  provider: ^6.1.5

  # UI
  loading_animation_widget: ^1.3.0
  rounded_loading_button_plus: ^3.0.1
  pinput: ^5.0.1
  country_picker: ^2.0.27
  restart_app: ^1.3.2
  url_launcher: ^6.3.2

  # Payments
  flutter_stripe: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vehicles/
    - themes/
